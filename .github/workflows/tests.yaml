# The dashboard builders are scripts run inside a Hopsworks job, so nothing here talks to a
# cluster: the tests stub the SDK and drive the pure parts (SQL construction, metric resolution,
# Superset object reconciliation) against a fake API. That is enough to hold the defects the
# enterprise readiness review found, all of which were reproducible without a deployment.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest tests -q
